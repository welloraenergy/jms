<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>JMS · Wellora Energy</title>
<link rel="icon" href="./favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--wellora-gold:#d3af36;color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff}body{min-height:100vh;padding:16px;display:flex;align-items:center;justify-content:center}
[hidden]{display:none!important}.login-card{width:100%;max-width:448px;padding:24px;border:1px solid #374151;border-radius:16px;background:#000;box-shadow:0 20px 25px -5px #0002,0 8px 10px -6px #0002}
.brand{display:flex;align-items:center;flex-direction:column;text-align:center;margin-bottom:24px}.brand img{width:96px;height:96px;object-fit:contain;margin-bottom:12px}.brand h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.025em;line-height:1.25}.brand p{margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--wellora-gold)}
button{font:inherit;cursor:pointer}.google-btn,.submit-btn{min-height:40px;width:100%;padding:10px 16px;border-radius:8px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:12px}.google-btn{background:#111;color:#fff;border:1px solid #333;font-weight:600}.google-btn:hover{background:#1a1a1a}.submit-btn{background:var(--wellora-gold);color:#000;border:0;font-weight:700}.submit-btn:hover{filter:brightness(1.08)}button:disabled{opacity:.6;cursor:wait}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#ffffffb3;font-size:12px}.divider::before,.divider::after{content:"";height:1px;flex:1;background:#374151}
.field{margin-bottom:16px}.field label{display:block;margin-bottom:4px;color:#fff;font-size:14px;font-weight:500}.field input{display:block;width:100%;min-height:40px;padding:10px 12px;background:#000;border:1px solid #4b5563;color:#fff;border-radius:8px;font-size:14px}.field input:focus{outline:none;border-color:var(--wellora-gold)}
.message{font-size:12px;margin:16px 0 0;text-align:center;overflow-wrap:anywhere;color:#f87171}.message:empty{display:none}
.workspace{width:min(100%,1100px);align-self:flex-start;margin:24px auto}.workspace-header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #333;padding-bottom:18px}.workspace-header h1{margin:0;font-size:24px}.workspace-header p{margin:5px 0;color:var(--wellora-gold);font-size:13px}.logout{background:#171717;color:#fff;border:1px solid #444;border-radius:8px;padding:10px 14px}.panel{margin-top:20px;padding:24px;border:1px solid #333;border-radius:16px;background:#090909}.panel h2{margin:0 0 8px;font-size:20px}.panel p{color:#ccc;line-height:1.6}.role-chip{display:inline-block;border:1px solid #9b812d;border-radius:6px;padding:5px 9px;color:var(--wellora-gold);font-size:12px;font-weight:700}
@media(min-width:640px){.login-card{padding:32px}.brand img{width:112px;height:112px}.brand h1{font-size:30px}.brand p{font-size:14px}.message{font-size:14px}}
.j-nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.j-nav button,.j-actions button,.j-row button{border:1px solid #776224;border-radius:8px;padding:9px 12px;background:#171717;color:#d3af36}.j-nav .selected,.j-actions button[type=submit]{background:#d3af36;color:#000}.j-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}.j-actions{display:flex;gap:8px;flex-wrap:wrap}.j-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.j-field{display:flex;flex-direction:column;gap:5px;font-size:13px}.j-field input,.j-field select,#companySearch{width:100%;background:#000;border:1px solid #4b5563;color:#fff;padding:10px;border-radius:8px}.j-card{background:#0b0b0b;border:1px solid #343434;border-radius:12px;padding:16px;margin:12px 0}.j-card h3{margin:0 0 12px}.j-sub,.j-note{color:#aaa;font-size:13px;margin:7px 0}.j-card section{margin:16px 0}.j-card section h4{color:#d3af36}.j-card details{border-top:1px solid #333;padding:10px 0}.j-card summary{cursor:pointer;color:#d3af36}.j-card input[type=checkbox]{accent-color:#d3af36}#jmsModules{margin-top:20px}@media(max-width:640px){.j-grid{grid-template-columns:1fr}.panel{padding:16px}}.j-stage{border:1px solid #343434;border-radius:10px;margin:12px 0;padding:12px;background:#090909}.j-stage summary{font-weight:700;color:#d3af36;cursor:pointer;padding:4px}.j-stage summary small{float:right;font-weight:400;color:#aaa}.j-stage .j-grid{padding:18px 4px 6px}.j-field textarea{width:100%;min-height:64px;background:#000;border:1px solid #4b5563;border-radius:8px;color:#fff;padding:10px;font:inherit;resize:vertical}.j-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 4px}.j-details div{overflow-wrap:anywhere}.j-details dt{color:#aaa;font-size:11px;margin-bottom:4px}.j-details dd{margin:0;font-size:13px}.j-actions button{cursor:pointer}@media(max-width:640px){.j-details{grid-template-columns:1fr}.j-stage summary small{float:none;margin-left:8px}}</style>
</head>
<body>
<main class="login-card" id="loginCard">
  <header class="brand"><img src="./icon-192.png" alt="Wellora Energy" width="192" height="192" draggable="false"><h1>JMS</h1><p>Portal Login</p></header>
  <button class="google-btn" type="button" id="googleSignIn">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.584-5.037-3.712H.956v2.332A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.963 10.708A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.281-1.708V4.96H.956A9 9 0 0 0 0 9c0 1.45.347 2.823.956 4.04l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.507.454 3.44 1.346l2.582-2.582C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.96l3.007 2.332C4.672 5.164 6.656 3.58 9 3.58z"/></svg>
    Sign in with Google
  </button>
  <div class="divider">OR</div>
  <form id="loginForm">
    <div class="field"><label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="submit-btn" id="loginSubmit" type="submit">Sign In</button>
  </form>
  <p class="message" id="errorMsg" role="alert" aria-live="polite"></p>
</main>
<main class="workspace" id="workspace" hidden>
  <header class="workspace-header"><div><h1>Wellora JMS</h1><p>Job Management System</p></div><button class="logout" id="logoutBtn" type="button">Sign Out</button></header>
  <section class="panel"><span class="role-chip" id="roleLabel"></span><h2 id="welcomeHeading">Welcome</h2><p id="workspaceDescription">Your authorized workspace will appear here as job modules are developed.</p></section>
  <section id="jmsModules"></section>
</main>
<script type="module" src="./auth.js"></script>
</body>
</html>
